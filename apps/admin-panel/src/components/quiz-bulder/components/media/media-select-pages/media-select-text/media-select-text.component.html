<div class="w-full h-full rounded main-div-text">
    <!-- Text Editor Area -->
    <div class="w-full h-[calc(100%-40px)]">
        <textarea
            #textEditor
            class="border border-gray-300 dark:border-gray-600 rounded p-3 w-full min-h-full resize-y overflow-auto bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100"
            placeholder="Type your text here..."
            [(ngModel)]="textInput!.content">
        </textarea>
    </div>

    <!-- Button -->
    <div class="w-full flex justify-center items-center h-[40px]">
        <button
            (click)="addText()"
            class="px-4 py-1 text-white bg-green-600 hover:bg-green-700 rounded text-sm disabled:opacity-50"
            [disabled]="!textInput?.content?.trim()">
            Add Text
        </button>
    </div>
</div>
